<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B70">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="외출준비">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>서윤서아네 외출준비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one narrow phone-first column — list chips on top, the open list below like a sticker sheet */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --fg:#1D2B2C; --muted:#5F6F6E; --line:#D5E0DC;
  --ink:#1E6B70; --sun:#F4B400; --sun-soft:#FFF1C7; --done:#9AA9A6; --danger:#B3402E;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141C1D; --surface:#1D2829; --fg:#E7EFEC; --muted:#9AAEAA; --line:#2E3C3D;
  --ink:#6CC3C4; --sun:#F6C33A; --sun-soft:#3A3319; --done:#61716F; --danger:#E0786A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141C1D; --surface:#1D2829; --fg:#E7EFEC; --muted:#9AAEAA; --line:#2E3C3D;
  --ink:#6CC3C4; --sun:#F6C33A; --sun-soft:#3A3319; --done:#61716F; --danger:#E0786A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--ink);letter-spacing:.5px}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--sun-soft);padding:8px 12px;border-radius:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:16px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .cnt{font-family:var(--body);font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.chip.add{border-style:dashed;color:var(--ink)}
.sheet{background:var(--surface);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.date{font-size:14px;color:var(--muted);margin-top:2px}
.datepick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--muted)}
.datepick input{flex:none;width:auto;padding:5px 8px;font-size:15px;border-radius:10px;color:var(--ink)}
.datepick .clr{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 6px;text-decoration:underline}
.dday{flex:none;font-family:var(--display);font-size:18px;background:var(--sun);color:#1D2B2C;border-radius:12px;padding:4px 10px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .3s}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.tick{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0}
.tick svg{width:18px;height:18px;opacity:0;transition:opacity .15s}
li.done .tick{background:var(--sun);border-color:var(--sun)}
li.done .tick svg{opacity:1}
.txt{font-size:17px;overflow-wrap:anywhere}
li.done .txt{color:var(--done);text-decoration:line-through}
.del{flex:none;border:0;background:transparent;color:var(--muted);font-size:20px;width:32px;height:32px;border-radius:8px}
.del:hover{color:var(--danger)}
form{display:flex;gap:8px}
input{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;flex:1}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--ink);color:var(--surface);font-family:var(--display);font-size:16px;flex:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.warn{background:var(--danger)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--fg);margin-bottom:4px}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tpl strong{font-family:var(--display);font-weight:400;font-size:18px}
.tpl span{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:10;pointer-events:none;font-size:14px}
.toast button{pointer-events:auto;border:0;background:var(--sun);color:#1D2B2C;border-radius:10px;padding:6px 12px;font-family:var(--display);font-size:15px;flex:none}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:flex-end;width:100%}
.confirm span{flex:1 1 100%;text-align:right;font-size:14px;color:var(--danger)}
.chip.trash{color:var(--muted);border-style:dashed}
.trashsec{display:flex;flex-direction:column;gap:6px}
.trashsec h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0;color:var(--muted)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.trow:last-child{border-bottom:0}
.trow .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.trow small{display:block;color:var(--muted);font-size:12px}
.trow .btn{padding:6px 12px;font-size:15px}
.trow{flex-wrap:wrap}
.trow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.mini{padding:6px 10px;font-size:14px}
.linkdel{border:0;background:transparent;color:var(--danger);font-size:14px;padding:6px 8px;border-radius:8px}
.trow .ask{flex:1 1 100%;display:flex;gap:6px;justify-content:flex-end;align-items:center;font-size:14px;color:var(--danger)}
.loginf{flex-direction:column}
.loginf .btn{align-self:stretch}
.allclear{font-family:var(--display);color:var(--ink);text-align:center;font-size:18px}
.txtwrap{flex:1;min-width:0;display:flex;flex-direction:column;cursor:text}
.memo{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
li.done .memo{color:var(--done)}
.icon{flex:none;border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;padding:0}
.icon svg{width:17px;height:17px}
.editrow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.editrow input{padding:8px 10px;font-size:16px}
.editbtns{display:flex;gap:6px;justify-content:flex-end}
.editbtns .btn{padding:6px 14px;font-size:15px}
.head h2{cursor:text}
.namefield{font-family:var(--display);font-size:20px;padding:6px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>서윤서아네 외출준비❤️</h1>
    <p class="sub">나들이·여행 전에 하나씩 동그라미 쳐요</p>
  </header>
    <p class="note" id="connNote" hidden>인터넷이 끊겨서 아직 못 올린 내용이 있어요. 폰에는 저장돼 있고, 연결되면 자동으로 올라가요.</p>
  <div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastBtn" type="button">되돌리기</button></div>
  <nav class="chips" id="chips" aria-label="목록"></nav>
  <section class="sheet" id="sheet"><div class="empty"><b>불러오는 중…</b></div></section>
</div>

<script src="supabase.js"></script>
<script>
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
const TEMPLATES = {
  "주말 나들이": ["물병 2개","간식 (과자·과일)","물티슈·손수건","여벌옷 (둘째)","기저귀·팬티","모자","선크림","작은 장난감·스티커북","돗자리","비닐봉투"],
  "여행": ["여권·신분증","아이 상비약 (해열제·밴드)","여벌옷 3일분","잠옷","칫솔·치약","충전기","수영복·래시가드","물놀이 튜브","애착인형","카시트"],
  "유치원 소풍": ["도시락","물병","돗자리","물티슈","모자","이름표","간식 (과자 1봉)","여벌 양말"],
  "빈 목록": []
};
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#1D2B2C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let lists = [];          // [{id,name,date,order,items:[{id,text,memo,done}]}]
let current = null;      // list id or "new"
let loaded = false;
let confirmDel = false;
let editing = null;      // item id being edited, or "__name"
let store = null;
let confirmAt = 0;
let purgeAsk = null, purgeAt = 0;   // 보관함 영구 삭제 확인 중인 항목
let toastTimer = null;
function toast(msg, undo){
  const t=document.getElementById("toast");
  document.getElementById("toastMsg").textContent=msg;
  document.getElementById("toastBtn").onclick=()=>{ t.hidden=true; clearTimeout(toastTimer); undo(); };
  t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.hidden=true; },3000);
}

/* ---- storage: Supabase (가족 계정) + 폰 안 캐시 ---- */
const SB_URL="https://yyugwgxmkcjtozpkhurp.supabase.co";
const SB_KEY="sb_publishable_dqCSOPI5gdpNRFoXd4d2RQ__fgep_Nt";
const CACHE="chaeng-cache-v1";
const writes = new Map();   // listId -> {busy, dirty}: 한 목록은 한 번에 하나씩만 저장
const failed = new Set();   // 인터넷이 끊겨 못 올린 목록
let sb=null, needLogin=false, readyResolve; const ready=new Promise(r=>readyResolve=r);
function cacheSave(){ try{ localStorage.setItem(CACHE,JSON.stringify(lists)); }catch(e){} }
function setNote(on){ document.getElementById("connNote").hidden=!on; }
async function boot(){
  try{ const c=JSON.parse(localStorage.getItem(CACHE)); if(Array.isArray(c)){ lists=c; loaded=true; } }catch(e){}
  if(!window.supabase){ if(loaded) render(); else sheet.innerHTML='<div class="empty"><b>앱을 다 불러오지 못했어요</b>새로고침해 주세요</div>'; setNote(true); return; }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ showLogin(); return; }
  render();
  start();
}
async function start(){
  needLogin=false;
  store={ put: async l=>{ const {id,...body}=l;
    const r=await sb.from("lists").upsert({id,data:JSON.parse(JSON.stringify(body)),updated_at:new Date().toISOString()});
    if(r.error) throw r.error; },
    remove: async id=>{ const r=await sb.from("lists").delete().eq("id",id); if(r.error) throw r.error; } };
  readyResolve();
  await refresh();
  sb.channel("lists-sync").on("postgres_changes",{event:"*",schema:"public",table:"lists"},p=>{
    const row=p.new; if(!row||!row.id||writes.has(row.id)||failed.has(row.id)) return;
    const inc={id:row.id,...row.data};
    const i=lists.findIndex(x=>x.id===row.id);
    if(i>=0){ if(JSON.stringify(lists[i])===JSON.stringify(inc)) return; lists[i]=inc; } else lists.push(inc);
    cacheSave(); render();
  }).subscribe();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) resync(); });
  window.addEventListener("online",resync);
}
function resync(){ [...failed].forEach(id=>{ const l=lists.find(x=>x.id===id); if(l) save(l); }); refresh(); }
async function refresh(){
  const {data,error}=await sb.from("lists").select("id,data");
  if(error){ setNote(true); return; }
  if(!failed.size) setNote(false);
  const incoming=data.map(r=>{ if(writes.has(r.id)||failed.has(r.id)){ const m=lists.find(x=>x.id===r.id); if(m) return m; } return {id:r.id,...r.data}; });
  lists.forEach(l=>{ if((writes.has(l.id)||failed.has(l.id)) && !incoming.some(x=>x.id===l.id)) incoming.push(l); });
  const same=loaded && JSON.stringify(incoming)===JSON.stringify(lists);
  lists=incoming; loaded=true; cacheSave(); if(!same) render();
}
function showLogin(){
  needLogin=true; chips.innerHTML=""; sheet.dataset.mode="login";
  sheet.innerHTML=`<div class="head"><div><h2>가족 계정으로 로그인</h2><div class="date">처음 한 번만 하면 돼요</div></div></div>
    <form id="loginForm" class="loginf">
      <input id="lgEmail" type="email" autocomplete="username" placeholder="이메일" aria-label="이메일">
      <input id="lgPw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
      <button class="btn" type="submit">로그인</button>
      <p id="lgErr" class="memo"></p>
    </form>`;
}

async function save(l){
  const w = writes.get(l.id) || {busy:false,dirty:false};
  writes.set(l.id,w);
  if(w.busy){ w.dirty=true; return; }
  w.busy=true; cacheSave();
  await ready;
  try{
    do{ w.dirty=false; const latest=lists.find(x=>x.id===l.id); if(!latest) break; await store.put(latest); }while(w.dirty);
    failed.delete(l.id); if(!failed.size) setNote(false);
  }catch(e){ console.warn(e); failed.add(l.id); setNote(true); }
  writes.delete(l.id); cacheSave();
}

/* ---- helpers ---- */
function dday(dateStr){
  if(!dateStr) return "";
  const t=new Date(); t.setHours(0,0,0,0);
  const n=Math.round((new Date(dateStr+"T00:00:00")-t)/86400000);
  return n===0?"D-DAY":n>0?`D-${n}`:"지난 일정";
}
function fmtDate(s){
  if(!s) return "";
  const d=new Date(s+"T00:00:00");
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
}
function isPast(l){ if(!l.date) return false; const t=new Date(); t.setHours(0,0,0,0); return new Date(l.date+"T00:00:00")<t; }
const archived = l => !!l.deletedAt || isPast(l);   // 보관함: 직접 넣은 목록 + 날짜 지난 목록
const live = () => lists.filter(l=>!archived(l));
const vis = l => l.items.filter(i=>!i.deletedAt);   // 지운 물건은 휴지통에 남겨 둔다
const MONTH = 30*86400000;
function trashCount(){ return lists.filter(archived).length + live().reduce((n,l)=>n+l.items.filter(i=>i.deletedAt).length,0); }
function ago(t){ const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
const cur = () => live().find(l=>l.id===current);
// 가까운 날짜 먼저 → 날짜 없는 목록 → 지난 일정
function sorted(){
  const today=new Date(); today.setHours(0,0,0,0);
  const rank=l=>{ if(!l.date) return [1,0]; const t=new Date(l.date+"T00:00:00").getTime();
    return t>=today.getTime()?[0,t]:[2,-t]; };
  return live().sort((a,b)=>{ const x=rank(a),y=rank(b); return x[0]-y[0]||x[1]-y[1]||(a.order||0)-(b.order||0); });
}

/* ---- render ---- */
// 바뀐 부분만 다시 그린다 (날짜 선택창·입력 중인 칸이 닫히지 않게)
function setHTML(el,html){ if(el._h!==html){ el.innerHTML=html; el._h=html; } }
const chips=document.getElementById("chips");
const sheet=document.getElementById("sheet");
chips.addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; purgeAsk=null; current=b.dataset.id; confirmDel=false; editing=null; render(); });

function render(){
  if(needLogin) return;
  if(!loaded){ sheet.innerHTML='<div class="empty"><b>불러오는 중…</b></div>'; return; }
  const order=sorted();
  if(current!=="new" && current!=="trash" && !cur()){ current = order[0]?.id || "new"; editing=null; }
  chips.innerHTML = order.map(l=>{
    const dd=dday(l.date); const left=vis(l).filter(i=>!i.done).length;
    return `<button class="chip" data-id="${l.id}" aria-pressed="${l.id===current}">${esc(l.name)}<span class="cnt">${dd&&dd!=="지난 일정"?dd+" · ":""}${left?left+"개 남음":"완료"}</span></button>`;
  }).join("") + `<button class="chip add" data-id="new" aria-pressed="${current==="new"}">+ 새 목록</button>`
    + (trashCount()||current==="trash" ? `<button class="chip trash" data-id="trash" aria-pressed="${current==="trash"}">보관함<span class="cnt">${trashCount()}</span></button>` : "");
  if(current==="trash"){ sheet.dataset.mode="trash"; sheet.innerHTML=trashView(); return; }

  if(current==="new"){
    if(sheet.dataset.mode!=="new"){ sheet.dataset.mode="new"; sheet.innerHTML=newView(); }
    return;
  }
  const l=cur();
  if(sheet.dataset.mode!==l.id){
    sheet.dataset.mode=l.id;
    sheet.innerHTML=`<div class="head" id="pHead"></div><div id="pProg"></div><div id="pItems"></div>
      <form id="addForm"><input id="addInput" placeholder="챙길 물건 (예: 여벌 양말)" autocomplete="off" enterkeyhint="done" aria-label="챙길 물건"><button class="btn" type="submit">추가</button></form>
      <div class="tools" id="pTools"></div>`;
  }
  const V=vis(l); const total=V.length, done=V.filter(i=>i.done).length, dd=dday(l.date);
  if(editing!=="__name"){
    setHTML(sheet.querySelector("#pHead"),`
      <div style="min-width:0"><h2 data-act="name" title="눌러서 이름 고치기">${esc(l.name)}</h2>
        <div class="datepick"><span>날짜</span>
          <input type="date" id="listDate" value="${l.date||""}" aria-label="날짜">
          ${l.date?`<button class="clr" data-act="clearDate" type="button">날짜 지우기</button>`:""}</div></div>
      ${dd?`<span class="dday">${dd}</span>`:""}`);
  }
  setHTML(sheet.querySelector("#pProg"),`
      <div class="bar"><i style="width:${total?done/total*100:0}%"></i></div>
      <div class="prog"><span>${done} / ${total} 챙김</span><span>${total?Math.round(done/total*100):0}%</span></div>
      ${total&&done===total?`<p class="allclear">다 챙겼어요! 즐겁게 다녀오세요</p>`:""}`);
  // 고치는 중이면 목록을 다시 그리지 않는다 (쓰던 글자 보호)
  if(!(editing && editing!=="__name" && l.items.some(i=>i.id===editing))){
    if(editing && editing!=="__name") editing=null;
    const items=[...V].sort((a,b)=>a.done-b.done);
    setHTML(sheet.querySelector("#pItems"), total?`<ul>${items.map(i=>`
      <li class="${i.done?"done":""}" data-id="${i.id}">
        <button class="tick" data-act="tick" aria-label="${esc(i.text)} ${i.done?"체크 해제":"챙김"}">${TICK}</button>
        <div class="txtwrap" data-act="edit"><span class="txt">${esc(i.text)}</span>${i.memo?`<span class="memo">${esc(i.memo)}</span>`:""}</div>
        <button class="icon" data-act="edit" aria-label="${esc(i.text)} 고치기">${PEN}</button>
        <button class="del" data-act="del" aria-label="${esc(i.text)} 지우기">×</button>
      </li>`).join("")}</ul>`:`<div class="empty"><b>아직 비어 있어요</b>아래에 챙길 물건을 적어보세요</div>`);
  }
  setHTML(sheet.querySelector("#pTools"),`
      ${done?`<button class="btn ghost" data-act="reset">체크 모두 풀기</button>`:""}
      <button class="btn ghost" data-act="archive">보관함으로 옮기기</button>`);
}

function openEdit(li, item){
  editing=item.id;
  sheet.querySelector("#pItems")._h=null;   // 직접 바꾼 칸이므로 다음에 꼭 다시 그리게
  li.innerHTML=`<div class="editrow">
      <input id="edText" value="${esc(item.text)}" aria-label="물건 이름" enterkeyhint="next">
      <input id="edMemo" value="${esc(item.memo||"")}" placeholder="메모 (예: 첫째 것, 가방 앞주머니)" aria-label="메모" enterkeyhint="done">
      <div class="editbtns"><button class="btn ghost" data-act="edCancel" type="button">취소</button><button class="btn" data-act="edSave" type="button">저장</button></div>
    </div>`;
  const t=li.querySelector("#edText"); t.focus(); t.setSelectionRange(t.value.length,t.value.length);
  li.querySelector("#edText").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); li.querySelector("#edMemo").focus(); } if(e.key==="Escape") cancelEdit(); };
  li.querySelector("#edMemo").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); commitEdit(li); } if(e.key==="Escape") cancelEdit(); };
}
function commitEdit(li){
  const l=cur(); const it=l&&l.items.find(i=>i.id===li.dataset.id);
  const text=li.querySelector("#edText").value.trim(), memo=li.querySelector("#edMemo").value.trim();
  editing=null;
  if(it && text && (text!==it.text || memo!==(it.memo||""))){ it.text=text; if(memo) it.memo=memo; else delete it.memo; render(); save(l); }
  else render();
}
function cancelEdit(){ editing=null; render(); }

function openNameEdit(){
  const l=cur(); editing="__name";
  const h=sheet.querySelector("#pHead"); h._h=null;
  h.innerHTML=`<div class="editrow"><input id="edName" class="namefield" value="${esc(l.name)}" aria-label="목록 이름" enterkeyhint="done">
    <div class="editbtns"><button class="btn ghost" data-act="nmCancel" type="button">취소</button><button class="btn" data-act="nmSave" type="button">저장</button></div></div>`;
  const inp=h.querySelector("#edName"); inp.focus();
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); commitName(); } if(e.key==="Escape"){ editing=null; render(); } };
}
function commitName(){
  const l=cur(); const v=sheet.querySelector("#edName").value.trim(); editing=null;
  if(l && v && v!==l.name){ l.name=v; render(); save(l); } else render();
}

/* 이벤트는 한 번만 연결 (다시 그릴 때마다 붙이지 않음) */
sheet.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="rList"){ restoreList(el.dataset.l); return; }
  if(act==="copy"){ copyList(el.dataset.l); return; }
  if(act==="purgeAsk"){ purgeAsk=el.dataset.k; purgeAt=Date.now(); render(); return; }
  if(act==="purgeNo"){ purgeAsk=null; render(); return; }
  if(act==="purgeYes"){ if(Date.now()-purgeAt<700) return; const k=purgeAsk; purgeAsk=null; purge(k); return; }
  if(act==="rItem"){ restoreItem(el.dataset.l, el.dataset.i); return; }
  if(current==="new"||current==="trash") return;
  const l=cur(); if(!l) return;
  const li=el.closest("li"); const it=li && l.items.find(i=>i.id===li.dataset.id);
  if(act==="tick" && it){ it.done=!it.done; render(); save(l); }
  else if(act==="del" && it){ it.deletedAt=Date.now(); render(); save(l);
    toast(`‘${it.text}’ 지웠어요 (보관함에 남아요)`,()=>restoreItem(l.id,it.id)); }
  else if(act==="edit" && it){ if(editing && editing!==it.id){ editing=null; render(); } const row=sheet.querySelector(`li[data-id="${it.id}"]`); if(row) openEdit(row,it); }
  else if(act==="edSave" && li){ commitEdit(li); }
  else if(act==="edCancel"){ cancelEdit(); }
  else if(act==="name"){ openNameEdit(); }
  else if(act==="nmSave"){ commitName(); }
  else if(act==="nmCancel"){ editing=null; render(); }
  else if(act==="clearDate"){ l.date=""; render(); save(l); }
  else if(act==="reset"){ vis(l).forEach(i=>i.done=false); render(); save(l); }
  else if(act==="archive"){ l.deletedAt=Date.now(); current=null; render(); save(l);
    toast(`‘${l.name}’ 보관함으로 옮겼어요`,()=>restoreList(l.id)); }
  else if(act==="askDel"){ confirmDel=true; confirmAt=Date.now(); render(); }
  else if(act==="cancelDel"){ confirmDel=false; render(); }
  else if(act==="doDel"){ if(Date.now()-confirmAt<700) return; // 두 번 연달아 눌린 경우 무시
    l.deletedAt=Date.now(); confirmDel=false; current=null; render(); save(l);
    toast(`‘${l.name}’ 목록을 휴지통으로 옮겼어요`,()=>restoreList(l.id)); }
});
sheet.addEventListener("change",e=>{
  if(e.target.id!=="listDate") return;
  const l=cur(); if(!l) return; l.date=e.target.value; render(); save(l);
});
sheet.addEventListener("submit",async e=>{
  if(e.target.id!=="loginForm") return;
  e.preventDefault();
  const err=sheet.querySelector("#lgErr"); err.textContent="로그인 중…";
  const {error}=await sb.auth.signInWithPassword({email:sheet.querySelector("#lgEmail").value.trim(),password:sheet.querySelector("#lgPw").value});
  if(error){ err.textContent="이메일이나 비밀번호가 맞지 않아요. 다시 확인해 주세요."; return; }
  sheet.dataset.mode=""; needLogin=false; loaded=false; render(); start();
});
sheet.addEventListener("submit",e=>{
  if(e.target.id!=="addForm") return;
  e.preventDefault();
  const inp=sheet.querySelector("#addInput"); const v=inp.value.trim(); if(!v) return;
  const l=cur(); if(!l) return;
  l.items.push({id:uid(),text:v,done:false}); inp.value=""; render(); save(l);
});

function restoreList(id){
  const L=lists.find(x=>x.id===id); if(!L) return;
  delete L.deletedAt; current=L.id; render(); save(L);
}
function restoreItem(lid,iid){
  const L=lists.find(x=>x.id===lid); if(!L) return;
  const it=L.items.find(i=>i.id===iid); if(!it) return;
  delete it.deletedAt; if(L.deletedAt) delete L.deletedAt;
  if(current==="trash" && trashCount()) render(); else { current=L.id; render(); }
  save(L);
}
function copyList(id, name, date){
  const src=lists.find(x=>x.id===id); if(!src) return;
  const l={id:uid(),name:name||src.name,date:date||"",order:Date.now(),
    items:vis(src).map(i=>{ const n={id:uid(),text:i.text,done:false}; if(i.memo) n.memo=i.memo; return n; })};
  lists.push(l); current=l.id; render(); save(l);
  toast(`‘${l.name}’ 새로 만들었어요. 날짜를 정하고 고쳐 쓰세요`,()=>{ const L=lists.find(x=>x.id===l.id); if(L){ L.deletedAt=Date.now(); current="trash"; render(); save(L);} });
}
function purgeRow(key){
  return purgeAsk===key
    ? `<div class="ask"><span>완전히 지울까요? 되돌릴 수 없어요.</span><button class="btn warn mini" data-act="purgeYes" data-k="${key}">지우기</button><button class="btn ghost mini" data-act="purgeNo">취소</button></div>`
    : `<button class="linkdel" data-act="purgeAsk" data-k="${key}">삭제</button>`;
}
function trashView(){
  const dl=lists.filter(archived).sort((a,b)=>(b.deletedAt||b.order||0)-(a.deletedAt||a.order||0));
  const di=live().flatMap(l=>l.items.filter(i=>i.deletedAt).map(i=>({l,i}))).sort((a,b)=>b.i.deletedAt-a.i.deletedAt);
  const head=`<div class="head"><div><h2>보관함</h2><div class="date">지난 일정과 넘겨둔 목록이 모여요. 필요 없는 건 ‘삭제’로 완전히 지울 수 있어요.</div></div></div>`;
  if(!dl.length && !di.length) return head+`<div class="empty"><b>비어 있어요</b>날짜가 지난 목록은 자동으로 여기로 와요</div>`;
  return head
   + (dl.length?`<div class="trashsec"><h3>지난 목록</h3>${dl.map(l=>`<div class="trow"><div class="tt">${esc(l.name)}<small>${l.date?fmtDate(l.date)+" · ":""}물건 ${vis(l).length}개</small></div>
        <div class="acts"><button class="btn mini" data-act="copy" data-l="${l.id}">이걸로 새 목록</button>
        ${isPast(l)?"":`<button class="btn ghost mini" data-act="rList" data-l="${l.id}">꺼내기</button>`}
        ${purgeAsk===`L:${l.id}`?"":purgeRow(`L:${l.id}`)}</div>
        ${purgeAsk===`L:${l.id}`?purgeRow(`L:${l.id}`):""}</div>`).join("")}</div>`:"")
   + (di.length?`<div class="trashsec"><h3>지운 물건</h3>${di.map(({l,i})=>{ const k=`I:${l.id}:${i.id}`; return `<div class="trow"><div class="tt">${esc(i.text)}<small>${esc(l.name)} · ${ago(i.deletedAt)} 지움</small></div>
        <div class="acts"><button class="btn ghost mini" data-act="rItem" data-l="${l.id}" data-i="${i.id}">되살리기</button>${purgeAsk===k?"":purgeRow(k)}</div>
        ${purgeAsk===k?purgeRow(k):""}</div>`; }).join("")}</div>`:"");
}
function purge(key){
  const [t,lid,iid]=key.split(":");
  const L=lists.find(x=>x.id===lid); if(!L) return;
  if(t==="L"){ lists=lists.filter(x=>x!==L); render(); store.remove(lid).catch(()=>{}); }
  else { L.items=L.items.filter(i=>i.id!==iid); render(); save(L); }
}
function newView(){
  return `<div class="head"><div><h2>새 목록 만들기</h2><div class="date">자주 쓰는 준비물로 시작하고 고쳐 쓰면 돼요</div></div></div>
    <div class="row">
      <label>목록 이름<input id="newName" placeholder="예: 증평 나들이"></label>
      <label>날짜 (선택)<input id="newDate" type="date"></label>
    </div>
    ${lists.length?`<div class="trashsec"><h3>예전 목록 불러와서 고쳐 쓰기</h3><div class="tpls">${[...lists].sort((a,b)=>(b.order||0)-(a.order||0)).map(l=>`<button class="tpl" data-copy="${l.id}"><strong>${esc(l.name)}</strong><span>${l.date?fmtDate(l.date)+" · ":""}물건 ${vis(l).length}개</span></button>`).join("")}</div></div><h3 style="font-family:var(--display);font-weight:400;font-size:17px;margin:0;color:var(--muted)">기본 틀로 시작하기</h3>`:""}
    <div class="tpls">${Object.entries(TEMPLATES).map(([k,v])=>`<button class="tpl" data-k="${k}"><strong>${k}</strong><span>${v.length?v.slice(0,3).join(", ")+" 외 "+(v.length-3)+"개":"처음부터 직접 적기"}</span></button>`).join("")}</div>`;
}
sheet.addEventListener("click",e=>{
  if(current!=="new") return;
  const b=e.target.closest(".tpl"); if(!b) return;
  if(b.dataset.copy){ copyList(b.dataset.copy, sheet.querySelector("#newName").value.trim(), sheet.querySelector("#newDate").value); return; }
  const k=b.dataset.k;
  const name=sheet.querySelector("#newName").value.trim() || (k==="빈 목록"?"새 목록":k);
  const l={id:uid(),name,date:sheet.querySelector("#newDate").value||"",order:Date.now(),
    items:TEMPLATES[k].map(t=>({id:uid(),text:t,done:false}))};
  lists.push(l); current=l.id; render(); save(l);
});
boot();
</script>
</body>
</html>
